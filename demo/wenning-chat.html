<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>跟温宁聊天 · 心动小屋 Day 4</title>
    <style>
      :root {
        --bg: #faf7f4;
        --card: #ffffff;
        --wenning: #ffe4ec;
        --wenning-text: #4a2e3a;
        --me: #cfe4ff;
        --me-text: #1a3a5f;
        --muted: #9a8f92;
        --accent: #d47a90;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: #333;
      }
      .app {
        max-width: 640px;
        margin: 0 auto;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--card);
        box-shadow: 0 0 24px rgba(0,0,0,0.05);
      }
      header {
        display: flex;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid #eee;
        gap: 12px;
      }
      .avatar {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: linear-gradient(135deg, #ffd0dc, #ffe8f0);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
      }
      .who .name { font-weight: 600; font-size: 15px; }
      .who .status { font-size: 12px; color: var(--muted); margin-top: 2px; }
      .clear-btn {
        margin-left: auto;
        background: transparent;
        border: 1px solid #eee;
        color: var(--muted);
        padding: 6px 10px;
        border-radius: 8px;
        font-size: 12px;
        cursor: pointer;
      }
      .clear-btn:hover { background: #fafafa; }

      .chat {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .bubble {
        max-width: 78%;
        padding: 10px 14px;
        border-radius: 16px;
        font-size: 14.5px;
        line-height: 1.55;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .bubble.wenning {
        background: var(--wenning);
        color: var(--wenning-text);
        align-self: flex-start;
        border-bottom-left-radius: 4px;
      }
      .bubble.me {
        background: var(--me);
        color: var(--me-text);
        align-self: flex-end;
        border-bottom-right-radius: 4px;
      }
      .bubble.thinking {
        color: var(--muted);
        font-style: italic;
      }
      .empty-hint {
        color: var(--muted);
        text-align: center;
        margin-top: 40px;
        font-size: 13px;
      }

      .composer {
        display: flex;
        gap: 8px;
        padding: 12px;
        border-top: 1px solid #eee;
      }
      .composer textarea {
        flex: 1;
        resize: none;
        height: 44px;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid #e5e5e5;
        font-size: 14px;
        font-family: inherit;
        outline: none;
      }
      .composer textarea:focus { border-color: var(--accent); }
      .composer button {
        background: var(--accent);
        color: white;
        border: none;
        padding: 0 18px;
        border-radius: 12px;
        font-size: 14px;
        cursor: pointer;
      }
      .composer button:disabled { opacity: 0.4; cursor: not-allowed; }

      .footer {
        text-align: center;
        color: var(--muted);
        font-size: 11px;
        padding: 6px 0 10px;
      }
      .error {
        color: #c0392b;
        background: #fdecea;
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 13px;
        margin: 0 16px;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div class="avatar">💗</div>
        <div class="who">
          <div class="name">温宁</div>
          <div class="status">厨房 · 21:13</div>
        </div>
        <button class="clear-btn" id="clear-btn">清空对话</button>
      </header>

      <div class="chat" id="chat">
        <div class="empty-hint" id="empty-hint">
          刚从厨房出来 · 试着跟她说点什么
        </div>
      </div>

      <div id="error-area"></div>

      <form class="composer" id="composer">
        <textarea
          id="input"
          placeholder="给温宁发消息…（Enter 发送，Shift+Enter 换行）"
          autocomplete="off"
        ></textarea>
        <button type="submit" id="send-btn">发送</button>
      </form>

      <div class="footer" id="usage">token: 0（累计）</div>
    </div>

    <script>
      const API = "http://localhost:3001/api/chat";
      const STORAGE_KEY = "flipped-ai:wenning-chat";
      const TOKEN_KEY = "flipped-ai:wenning-tokens";

      const chatEl = document.getElementById("chat");
      const emptyHint = document.getElementById("empty-hint");
      const inputEl = document.getElementById("input");
      const sendBtn = document.getElementById("send-btn");
      const form = document.getElementById("composer");
      const clearBtn = document.getElementById("clear-btn");
      const usageEl = document.getElementById("usage");
      const errorArea = document.getElementById("error-area");

      /** @type {{role:'user'|'assistant', content:string}[]} */
      let history = [];
      let totalTokens = 0;

      function loadState() {
        try {
          history = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
          totalTokens = Number(localStorage.getItem(TOKEN_KEY) || 0);
        } catch { history = []; totalTokens = 0; }
      }
      function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
        localStorage.setItem(TOKEN_KEY, String(totalTokens));
      }
      function renderAll() {
        chatEl.innerHTML = "";
        if (history.length === 0) {
          chatEl.appendChild(emptyHint);
        } else {
          for (const m of history) appendBubble(m.role, m.content);
        }
        usageEl.textContent = `token: ${totalTokens}（累计）`;
      }
      function appendBubble(role, content, opts = {}) {
        if (emptyHint.parentNode) emptyHint.remove();
        const div = document.createElement("div");
        div.className = "bubble " + (role === "user" ? "me" : "wenning");
        if (opts.thinking) div.classList.add("thinking");
        div.textContent = content;
        chatEl.appendChild(div);
        chatEl.scrollTop = chatEl.scrollHeight;
        return div;
      }
      function showError(msg) {
        errorArea.innerHTML = `<div class="error">${msg}</div>`;
        setTimeout(() => (errorArea.innerHTML = ""), 6000);
      }

      async function send(userMessage) {
        appendBubble("user", userMessage);
        history.push({ role: "user", content: userMessage });
        saveState();

        const thinkingBubble = appendBubble("assistant", "温宁正在打字…", { thinking: true });
        sendBtn.disabled = true;

        try {
          const res = await fetch(API, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            // history 里发出去的最新一条 user 消息，服务端会自己拼，这里传的是「之前」的历史
            body: JSON.stringify({
              history: history.slice(0, -1),
              userMessage,
            }),
          });
          const data = await res.json();
          thinkingBubble.remove();

          if (!res.ok) {
            showError((data.error || "请求失败") + (data.hint ? ` · ${data.hint}` : ""));
            // 回滚刚才那条 user，避免历史脏了
            history.pop();
            saveState();
            renderAll();
            return;
          }

          const reply = data.reply || "";
          appendBubble("assistant", reply);
          history.push({ role: "assistant", content: reply });
          totalTokens += data.usage?.totalTokens || 0;
          saveState();
          usageEl.textContent = `token: ${totalTokens}（累计） · 上一次 ${data.usage?.totalTokens || 0}`;
        } catch (err) {
          thinkingBubble.remove();
          showError("网络错误：" + (err?.message || String(err)) + " · 检查后端是否启动");
          history.pop();
          saveState();
          renderAll();
        } finally {
          sendBtn.disabled = false;
          inputEl.focus();
        }
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const text = inputEl.value.trim();
        if (!text) return;
        inputEl.value = "";
        send(text);
      });

      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          form.requestSubmit();
        }
      });

      clearBtn.addEventListener("click", () => {
        if (!confirm("清空对话和累计 token？")) return;
        history = [];
        totalTokens = 0;
        saveState();
        renderAll();
      });

      loadState();
      renderAll();
      inputEl.focus();
    </script>
  </body>
</html>
